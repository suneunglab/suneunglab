# 기관 공지 수집(엔진 A) — 계획서 69행·백로그 B-16, 설계 05 6·11절·07 1·7절·08 4·5절
# - 매일 04:20 KST(19:20 UTC) 예약: Actions 예약 실행이 30~87분 늦게 시작하므로(K-10) 05:00보다 앞당김.
#   늦어져도 06:00 게시 전에 끝나도록 하고, 놓친 날은 workflow_dispatch(수동 실행)로 다시 돌린다.
# - 공개 결과: data/notices/{YYYY}/{MM}.jsonl(제목·날짜·원문 링크만) → 이 저장소에 커밋.
# - 비공개 상태(streak.json·crawl_status.json·alerts.txt·kice_signals.json): 비공개 저장소
#   suneunglab/suneunglab-crawler-test 의 crawler-state/ 에 커밋. 이 저장소에는 절대 쓰지 않는다(run.py가 막음).
#   비공개 저장소 토큰(Secrets: PRIVATE_REPO_TOKEN)이 없으면 상태는 임시 폴더에만 두고(연속 실패 감지 꺼짐) 공지 수집만 한다.
name: crawl
on:
  schedule:
    - cron: "20 19 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "일부 출처만(쉼표로 구분, 비우면 전체)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      HAS_STATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r crawler/requirements.txt
      - name: 비공개 상태 저장소 받기(토큰이 있을 때만)
        if: env.HAS_STATE_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: suneunglab/suneunglab-crawler-test
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: _private
      - name: 수집
        id: run
        env:
          ONLY_IN: ${{ github.event.inputs.only }}
        run: |
          if [ "$HAS_STATE_TOKEN" = "true" ]; then STATE="$GITHUB_WORKSPACE/_private/crawler-state"; else STATE="$RUNNER_TEMP/crawler-state"; echo "::warning::PRIVATE_REPO_TOKEN 없음 — 상태를 임시 폴더에만 둠(연속 실패 감지 꺼짐)"; fi
          mkdir -p "$STATE"
          ONLY=""; if [ -n "$ONLY_IN" ]; then ONLY="--only $ONLY_IN"; fi
          set +e
          python crawler/run.py --notices data/notices --state "$STATE" $ONLY
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          cat "$STATE/alerts.txt" 2>/dev/null || true
      - name: 공개 결과 커밋(data/notices만)
        run: |
          git config user.name "suneunglab-bot"
          git config user.email "suneunglab@users.noreply.github.com"
          git add data/notices
          if git diff --cached --quiet; then echo "새 공지 없음"; else
            python tools/precommit_check.py $(git diff --cached --name-only)
            git commit -m "data: 기관 공지 수집 $(date +%F)"
            git pull --rebase -q && git push
          fi
      - name: 비공개 상태 커밋
        if: env.HAS_STATE_TOKEN == 'true'
        working-directory: _private
        run: |
          git config user.name "suneunglab-bot"
          git config user.email "suneunglab@users.noreply.github.com"
          git add crawler-state
          if ! git diff --cached --quiet; then git commit -m "crawler-state $(date +%F)" && git pull --rebase -q && git push; fi
      - name: 경보가 있으면 실패로 표시([주의])
        if: steps.run.outputs.rc != '0'
        run: |
          echo "::error::수집 경보(종료 코드 ${{ steps.run.outputs.rc }}) — alerts.txt 확인"
          exit 1
