# 저작권: 평가원 문장을 옮기지 않고 요소 이름(짧은 용어)만 쓴다. 설명은 사이트가 새로 쓴 요약(결정 17).
basis_note: 영어·한국사는 2028학년도용 평가 목표 자료가 아직 없어 2027학년도 자료(2015 개정 교육과정 기준)를 썼습니다. 2028학년도 자료가 나오면(2027-03 말 예상) 바로잡습니다.
