# 시험 당일 안내 — S7(03 화면설계 5절, B-12). 2026-11-23 작성.
# 근거: 03_참고자료 수능_공식자료_정리_2028.md 3·8절 — 평가원 수능 누리집 '수험생 유의사항'(2027학년도 기준 게시),
#       2027학년도 수능 부정행위 예방 관련 안내문(2026-10-16), 2028학년도 시험시간표 안내(2026-08-25).
# 2028학년도 유의사항은 2027-10 발표 예상 — 그 전까지 화면에 '2027학년도 기준'을 표시한다(03 S7 규칙).
basis: 2027학년도 기준
basis_note: 2028학년도 수험생 유의사항은 2027년 10월쯤 발표됩니다. 그 전까지 아래 내용은 2027학년도 기준이며, 2028학년도는 4교시(사회·과학 따로 진행) 관련 규정이 바뀔 수 있습니다.
before:
  - 수험표와 신분증을 가방에 넣어 둡니다.
  - 휴대폰·스마트워치·이어폰 같은 전자 기기는 집에 두는 것이 가장 안전합니다.
  - 아날로그 시계(통신·화면 기능 없는 것)를 챙깁니다. 시험실에 시계가 없습니다.
  - 점심 도시락과 물을 준비합니다. 시험장에서 주지 않습니다.
  - 시험장 위치와 가는 길·걸리는 시간을 미리 확인합니다.
day:
  - 08:10까지 시험실에 들어갑니다(시험장 출입은 06:30부터).
  - 2교시부터는 시험 시작 10분 전까지 자리에 앉습니다.
  - 전자 기기를 가지고 왔다면 1교시 시작 전에 감독관에게 냅니다.
  - 답안지 표기는 컴퓨터용 사인펜으로 하고, 고칠 때는 흰색 수정테이프를 씁니다.
allowed: [신분증, 수험표, 컴퓨터용 사인펜, 흰색 수정테이프, 흑색 연필, 지우개, 흑색 0.5mm 샤프심, 아날로그 시계(통신·화면 기능 없는 것), 마스크(감독관 확인)]
banned: [휴대폰, 스마트워치, 스마트안경, 이어폰 등 통신·결제 기능이 있는 물품, 화면이 표시되는 전자 기기(디지털 시계 포함), 충전식 물품]
penalties:
  - { level: 그해 시험 무효 + 다음 해 응시 자격 정지, cases: "남의 답안을 보거나 신호를 주고받기, 대리 시험, 부정한 휴대물 사용, 답을 보여 달라고 강요하기" }
  - { level: 그해 시험 무효, cases: "시험 종료령 뒤 답을 쓰거나 고치기, 반입 금지 물품을 내지 않고 가지고 있기, 소지품 검사 거부, 시험 시간에 다른 과목 문제지 보기, 종료령 뒤 가채점표 작성" }
